name: Build and push termbox image

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild so Claude Code and gridcraft stay current on every box
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            OFFICE_REFRESH=${{ github.run_id }}
          tags: |
            ghcr.io/anentrypoint/termbox:latest
            ghcr.io/anentrypoint/termbox:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
